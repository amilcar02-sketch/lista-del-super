<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f8f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Súper">
<title>Mi Súper</title>
<style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#173c2b;background:#f8f8f3}*{box-sizing:border-box}body{margin:0}.app{max-width:550px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(100px + env(safe-area-inset-bottom))}header{padding:28px 2px 17px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;letter-spacing:-1.3px;margin:0}h2{font-size:17px;margin:0}.sub{margin:5px 0 0;color:#69766c;font-size:14px}.icon-btn{border:0;background:#e8eee1;border-radius:50%;width:42px;height:42px;font-size:23px;color:#215d39;cursor:pointer}.summary{background:#eaf0e5;border-radius:20px;padding:18px;margin:5px 0 18px;display:flex;align-items:center;justify-content:space-between}.summary b{font-size:24px}.summary span{color:#607365;font-size:13px}.bar{height:7px;background:#d9e1d3;border-radius:9px;margin-top:12px;overflow:hidden}.fill{height:100%;background:#237345;border-radius:9px}.search{width:100%;padding:15px 17px;border:1px solid #d6ddd4;border-radius:15px;background:white;font:inherit;outline-color:#237345;margin-bottom:15px}.category{margin:17px 0;background:white;border-radius:19px;overflow:hidden;box-shadow:0 2px 14px #173c2b0b}.cathead{background:#eaf0e3;padding:13px 15px;font-weight:750;display:flex;align-items:center;gap:10px}.cathead span:last-child{margin-left:auto;color:#6c7c6d;font-size:13px}.row{min-height:64px;display:flex;align-items:center;gap:13px;padding:10px 14px;border-top:1px solid #edf0e9}.row .name{font-weight:650;flex:1;min-width:0}.row small{display:block;font-size:12px;font-weight:400;color:#778078;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row button{border:0;cursor:pointer}.circle{width:33px;height:33px;flex:none;border:2px solid #24764b;border-radius:50%;background:#fff;color:white;font-size:20px;display:grid;place-items:center}.circle.done{background:#237345}.add{background:#1e6b3e;color:white;border-radius:50%;height:36px;width:36px;font-size:26px;line-height:1}.added{color:#216742;background:#e4f2de;border-radius:18px;padding:8px 10px;font-size:12px;font-weight:700}.mini{font-size:12px;color:#758077}.menu{background:none;color:#788078;font-size:22px;padding:4px}.bought .name{text-decoration:line-through;color:#7c887e}.empty{text-align:center;padding:45px 22px;color:#6c786d}.empty strong{display:block;color:#234832;font-size:18px;margin:12px 0 5px}.empty .emoji{font-size:42px}.empty button,.primary{border:0;background:#196a3a;color:white;border-radius:16px;padding:14px 20px;font:inherit;font-weight:750;cursor:pointer}.empty button{margin-top:20px}.tabs{position:fixed;bottom:0;left:0;width:100%;background:#fff;border-top:1px solid #e4e9e2;padding:10px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:3}.tabs button{flex:1;max-width:265px;background:none;border:0;color:#748076;padding:7px;font-size:12px;font-weight:700;cursor:pointer}.tabs button.active{color:#16683b}.tabs .symbol{display:block;font-size:24px;margin-bottom:3px}.fab{position:fixed;bottom:calc(79px + env(safe-area-inset-bottom));right:max(18px,calc((100vw - 520px)/2));border:0;border-radius:40px;background:#1d6c3d;color:white;box-shadow:0 7px 20px #103d2540;padding:13px 19px;font-weight:750;font-size:15px;cursor:pointer}.overlay{position:fixed;inset:0;background:#15352270;z-index:5;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:550px;max-height:94dvh;overflow:auto;background:#fcfcf8;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.sheethead h2{font-size:24px}label{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}.field{width:100%;border:1px solid #d5ddd5;background:#fff;border-radius:14px;padding:14px;font:inherit;color:#173c2b}.hint{display:inline-block;background:#eaf3e5;color:#356747;border-radius:15px;padding:7px 10px;font-size:12px;margin:9px 0 0}.sheet .primary{width:100%;margin-top:24px}.hidden{display:none!important}.toast{position:fixed;z-index:10;bottom:calc(103px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#193d2a;color:white;padding:11px 18px;border-radius:20px;font-size:13px;white-space:nowrap;box-shadow:0 5px 20px #0003}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8bbf9c}
</style>
</head>
<body>
<main class="app">
<header><div><h1 id="title">Lista de compra</h1><p class="sub" id="subtitle">Tu compra, organizada</p></div><button class="icon-btn" id="newTop" aria-label="Agregar producto">＋</button></header>
<section id="content"></section>
</main>
<button class="fab" id="newFab">＋ Agregar producto</button>
<nav class="tabs"><button id="tabList" class="active"><span class="symbol">🛒</span>Comprar</button><button id="tabCatalog"><span class="symbol">▱</span>Mis productos</button></nav>
<div id="modal" class="overlay hidden">
<form id="form" class="sheet">
<div class="sheethead"><h2 id="formTitle">Agregar producto</h2><button type="button" class="icon-btn" id="close" aria-label="Cerrar">×</button></div>
<label for="product">Nombre del producto</label><input id="product" class="field" required maxlength="70" placeholder="Ej. Ketchup" autocomplete="off">
<div id="suggestion" class="hint hidden"></div>
<label for="category">Categoría</label><select id="category" class="field"></select>
<label for="qty">Cantidad</label><input id="qty" class="field" maxlength="40" placeholder="Ej. 1 unidad, 200 g">
<label for="note">Nota (opcional)</label><input id="note" class="field" maxlength="100" placeholder="Marca, presentación, etc.">
<button class="primary" id="submit">Guardar producto</button>
</form>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';const KEY='mi-super-v1';const categories=['Frutas y vegetales','Carnes y pescados','Delicatessen','Lácteos y huevos','Panadería','Despensa','Condimentos','Bebidas','Congelados','Limpieza','Higiene personal','Mascotas','Otros'];const icons={'Frutas y vegetales':'🥑','Carnes y pescados':'🥩','Delicatessen':'🧀','Lácteos y huevos':'🥛','Panadería':'🥖','Despensa':'🥫','Condimentos':'🧂','Bebidas':'🥤','Congelados':'🧊','Limpieza':'🧽','Higiene personal':'🧴','Mascotas':'🐾','Otros':'🛍️'};const rules=[['Condimentos',/ketchup|catsup|mayonesa|mostaza|salsa|aderezo|vinagre|sal\b|pimienta|or[eé]gano|comino|sazon|saz[oó]n|canela|especias|aceite de oliva/i],['Delicatessen',/jam[oó]n|queso|salami|pechuga de pavo|prosciutto|mortadela|embutido|tocineta|bacon/i],['Lácteos y huevos',/leche|yogur|yogurt|huevo|mantequilla|crema de leche/i],['Frutas y vegetales',/manzana|guineo|banana|pl[aá]tano|aguacate|tomate|lechuga|cebolla|papa|zanahoria|blueberr|fresa|lim[oó]n|naranja|br[oó]coli/i],['Carnes y pescados',/pollo|res\b|carne|cerdo|pescado|salm[oó]n|camar[oó]n|at[uú]n/i],['Panadería',/pan\b|baguette|croissant|tortilla|galleta/i],['Bebidas',/agua|jugo|refresco|coca.?cola|caf[eé]|cerveza|vino/i],['Limpieza',/detergente|cloro|jab[oó]n de fregar|suavizante|papel toalla|esponja/i],['Higiene personal',/shampoo|champ[uú]|desodorante|pasta dental|cepillo dental|papel higi[eé]nico/i],['Mascotas',/perro|gato|mascota|croqueta/i],['Congelados',/helado|congelad/i],['Despensa',/arroz|avena|habichuela|pasta|harina|az[uú]car|cereal|aceite/i]];const $=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch{data=[]}if(!Array.isArray(data))data=[];data=data.filter(x=>x&&typeof x.name==='string').map(x=>({...x,id:x.id||crypto.randomUUID(),status:['catalog','list','bought'].includes(x.status)?x.status:'catalog'}));let view='list',query='',editing=null;const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{showToast('No se pudo guardar en este navegador')}}function guess(s){return rules.find(([,re])=>re.test(s))?.[0]||'Otros'}function showToast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}function ordered(items){return categories.map(cat=>[cat,items.filter(x=>x.category===cat)]).filter(([,xs])=>xs.length)}function renderRows(items,mode){return ordered(items).map(([cat,xs])=>`<section class="category"><div class="cathead">${icons[cat]||'🛍️'} ${escape(cat)} <span>${xs.length}</span></div>${xs.map(x=>`<div class="row ${x.status==='bought'?'bought':''}">${mode==='catalog'?`<button class="menu" data-act="edit" data-id="${escape(x.id)}" aria-label="Editar ${escape(x.name)}">⋯</button>`:`<button class="circle ${x.status==='bought'?'done':''}" data-act="${x.status==='bought'?'undo':'buy'}" data-id="${escape(x.id)}" aria-label="${x.status==='bought'?'Desmarcar':'Marcar comprado'} ${escape(x.name)}">${x.status==='bought'?'✓':''}</button>`}<div class="name">${escape(x.name)}${x.note?`<small>${escape(x.note)}</small>`:''}</div>${mode==='catalog'?(x.status==='catalog'?`<button class="add" data-act="add" data-id="${escape(x.id)}" aria-label="Agregar ${escape(x.name)}">+</button>`:`<button class="added" data-act="${x.status==='bought'?'readd':'remove'}" data-id="${escape(x.id)}" aria-label="${x.status==='bought'?'Volver a agregar':'Quitar de la compra'} ${escape(x.name)}">${x.status==='bought'?'↻ Reponer':'✓ En lista'}</button>`):`<span class="mini">${escape(x.qty||'1 unidad')}</span><button class="menu" data-act="edit" data-id="${escape(x.id)}" aria-label="Editar ${escape(x.name)}">⋯</button>`}</div>`).join('')}</section>`).join('')}function render(){let pending=data.filter(x=>x.status==='list'),bought=data.filter(x=>x.status==='bought');$('title').textContent=view==='list'?'Lista de compra':'Mis productos';$('subtitle').textContent=view==='list'?'Tu compra, organizada':'Tu lista habitual';$('tabList').classList.toggle('active',view==='list');$('tabCatalog').classList.toggle('active',view==='catalog');if(view==='list'){let total=pending.length+bought.length,pct=total?Math.round(bought.length/total*100):0;$('content').innerHTML=`<div class="summary"><div><b>${pending.length} pendientes</b><br><span>${bought.length} comprados</span><div class="bar" style="width:190px;max-width:55vw"><div class="fill" style="width:${pct}%"></div></div></div><b style="font-size:16px">${pct}%</b></div>${pending.length?renderRows(pending,'list'):`<div class="empty"><div class="emoji">🛒</div><strong>${bought.length?'¡Compra completada!':'Tu lista está vacía'}</strong><div>Elige productos de tu catálogo para empezar.</div><button data-act="goCatalog">Ver mis productos</button></div>`}${bought.length?`<h2 style="margin:28px 2px 8px">Comprados (${bought.length})</h2><p class="sub">Desmarca uno si aún lo necesitas.</p>${renderRows(bought,'list')}<button class="primary" style="width:100%;background:#e4eee3;color:#22643d;margin-top:10px" data-act="finish">Finalizar compra · volver al catálogo</button>`:''}`}else{let matches=data.filter(x=>x.name.toLocaleLowerCase().includes(query.toLocaleLowerCase()));$('content').innerHTML=`<input class="search" id="search" type="search" placeholder="Buscar productos" value="${escape(query)}" aria-label="Buscar productos">${matches.length?renderRows(matches,'catalog'):`<div class="empty"><div class="emoji">🧺</div><strong>${query?'No encontramos ese producto':'Tu catálogo está vacío'}</strong><div>${query?'Prueba otra búsqueda.':'Agrega productos para armar tu lista habitual.'}</div></div>`}`;const input=$('search');input.addEventListener('input',()=>{let start=input.selectionStart;query=input.value;render();$('search').focus();$('search').setSelectionRange(start,start)})}}function openForm(x){editing=x?.id||null;$('formTitle').textContent=x?'Editar producto':'Agregar producto';$('submit').textContent=x?'Guardar cambios':'Guardar producto';$('product').value=x?.name||'';$('category').innerHTML=categories.map(c=>`<option>${escape(c)}</option>`).join('');$('category').value=x?.category||'Otros';$('qty').value=x?.qty||'1 unidad';$('note').value=x?.note||'';$('suggestion').classList.add('hidden');$('modal').classList.remove('hidden');setTimeout(()=>$('product').focus(),80)}function closeForm(){$('modal').classList.add('hidden');editing=null}document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=b.dataset.id,x=data.find(y=>y.id===id);if(act==='goCatalog'){view='catalog';render();return}if(act==='finish'){if(!confirm('¿Finalizar esta compra? Los productos comprados quedarán disponibles en Mis productos.'))return;data.forEach(y=>{if(y.status==='bought')y.status='catalog'});save();render();showToast('Compra finalizada');return}if(!x)return;if(act==='edit'){openForm(x);return}if(act==='add'||act==='readd'){x.status='list';showToast('Agregado a la compra')}if(act==='remove'){x.status='catalog';showToast('Quitado de la compra')}if(act==='buy'){x.status='bought';showToast('Marcado como comprado')}if(act==='undo'){x.status='list';showToast('De nuevo pendiente')}save();render()});$('newFab').onclick=$('newTop').onclick=()=>openForm();$('close').onclick=closeForm;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});$('tabList').onclick=()=>{view='list';query='';render()};$('tabCatalog').onclick=()=>{view='catalog';render()};$('product').addEventListener('input',()=>{if(editing)return;let name=$('product').value,c=guess(name);$('suggestion').textContent=`Sugerencia: ${c}`;$('suggestion').classList.toggle('hidden',!name.trim());$('category').value=c});$('form').addEventListener('submit',e=>{e.preventDefault();let name=$('product').value.trim(),category=$('category').value,qty=$('qty').value.trim()||'1 unidad',note=$('note').value.trim();if(!name)return;let duplicate=data.find(x=>x.id!==editing&&x.name.toLocaleLowerCase()===name.toLocaleLowerCase());if(duplicate){showToast('Ese producto ya existe');return}let wasEditing=!!editing;if(editing){let x=data.find(y=>y.id===editing);Object.assign(x,{name,category,qty,note})}else data.push({id:crypto.randomUUID(),name,category,qty,note,status:'catalog'});save();closeForm();render();showToast(wasEditing?'Producto actualizado':'Producto guardado')});render()})();
</script>
</body>
</html>
